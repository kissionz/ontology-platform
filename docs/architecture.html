<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>本体管理平台实施架构</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --paper: #f7f9fc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #61708a;
      --soft: #8a97aa;
      --rule: #dce3ee;
      --accent: #356cfb;
      --accent-tint: #eef3ff;
      --success: #17845c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
    body { font-family: "Avenir Next", "PingFang SC", sans-serif; }
    main { width: 1440px; min-height: 840px; margin: 0 auto; padding: 40px 40px 32px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 600 8px "SFMono-Regular", monospace; letter-spacing: .16em; }
    h1 { margin: 0; font: 600 32px "Avenir Next", "PingFang SC", sans-serif; }
    .subtitle { margin: 12px 0 28px; color: var(--muted); font-size: 12px; line-height: 20px; }
    figure { margin: 0; padding: 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
    svg { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--soft); font: 8px "SFMono-Regular", monospace; letter-spacing: .08em; }
  </style>
</head>
