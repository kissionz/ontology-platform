{
  "openapi": "3.1.0",
  "info": {
    "title": "Ontology Platform API",
    "version": "1.0.0",
    "description": "独立本体管理、语义解析与安全查询 API"
  },
  "servers": [
    {
      "url": "/v1"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "GetHealth",
        "summary": "检查服务状态",
        "description": "查看服务版本、组件配置状态和服务器时间；组件显示已配置不代表数据库连接测试通过。",
        "security": [],
        "x-required-scopes": "无需认证",
        "x-envelope-fields": [],
        "x-response-fields": [
          {
            "path": "status",
            "type": "string",
            "description": "服务状态。"
          },
          {
            "path": "version / kernelVersion",
            "type": "string",
            "description": "服务与公理内核版本。"
          },
          {
            "path": "components",
            "type": "object",
            "description": "组件配置状态，不代表数据库可连接。"
          },
          {
            "path": "time",
            "type": "string",
            "description": "服务器时间。"
          }
        ],
        "parameters": [],
        "responses": {
          "200": {
            "description": "直接返回状态对象，包含 status、version、kernelVersion、components、time。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
    "/system/openapi.json": {
      "get": {
        "operationId": "GetOpenApiDocument",
        "summary": "读取 API 契约",
        "description": "获取当前服务提供的 OpenAPI 3.1 文档，包含接口、参数、请求结构和中文说明。",
        "security": [],
        "x-required-scopes": "无需认证",
        "x-envelope-fields": [],
        "x-response-fields": [
          {
            "path": "openapi",
            "type": "string",
            "description": "OpenAPI 版本。"
          },
          {
            "path": "info",
            "type": "object",
            "description": "服务标题与版本。"
          },
          {
            "path": "servers[]",
            "type": "object[]",
            "description": "API 根地址。"
          },
          {
            "path": "paths",
            "type": "object",
            "description": "各接口操作、参数、示例和响应说明。"
          },
          {
            "path": "components.schemas",
