              }
            }
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "401": {
            "description": "缺少或使用了无效 Bearer API Key。"
          },
          "403": {
            "description": "密钥缺少所需权限，检查 error.details.requiredScopes。"
          },
          "429": {
            "description": "请求超过客户端限额，稍后重试。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
