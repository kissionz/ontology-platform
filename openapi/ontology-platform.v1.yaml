    "/namespaces/{ns}/drafts/{draftId}/publish": {
      "post": {
        "operationId": "PublishOntologyDraft",
        "summary": "发布本体版本",
        "description": "校验草稿及基线一致性后生成不可变发布版本，并启动值索引重建。",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-required-scopes": "ontology:publish",
        "parameters": [
          {
            "in": "path",
            "name": "ns",
            "required": true,
            "description": "本体命名空间，例如 retail。",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "path",
            "name": "draftId",
            "required": true,
            "description": "创建或读取草稿返回的 draftId。",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "data 为已发布快照；校验不通过或基线版本过期时拒绝发布。索引进度通过值索引状态接口查看。",
