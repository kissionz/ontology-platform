            "description": "可读错误说明。"
          },
          {
            "path": "error.stage",
            "type": "string（失败时）",
            "description": "失败阶段，例如 binding、planning、session。"
          },
          {
            "path": "error.retryable",
            "type": "boolean（失败时）",
            "description": "是否适合重试。"
          },
          {
            "path": "error.action / error.details",
            "type": "string / object（可选）",
            "description": "修复建议及错误详情；失败时 data 可能不存在。"
          }
        ],
        "x-response-fields": [
          {
            "path": "ontologyVersion / status",
            "type": "number / string",
            "description": "实际版本和发布状态。"
          },
          {
            "path": "counts",
            "type": "object",
            "description": "对象、关系、指标、公理等数量。"
          },
          {
            "path": "contentDigest",
            "type": "string",
            "description": "定义摘要。"
          },
          {
            "path": "valueIndex",
            "type": "object",
            "description": "值索引状态。"
          },
          {
            "path": "defaultObject",
            "type": "object / null",
            "description": "默认对象。"
          },
          {
            "path": "graph",
            "type": "object",
            "description": "概览图谱。"
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "ns",
            "required": true,
            "description": "本体命名空间，例如 retail。",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "version",
            "required": false,
            "description": "发布版本号或 latest；省略时读取最新发布版本。",
            "schema": {
              "type": "string",
              "default": "latest"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "data 包含版本信息、counts 和 contentDigest；响应头提供 ETag。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
