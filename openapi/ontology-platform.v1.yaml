    "schemas": {
      "OntologySnapshotV3": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "properties": {
          "schemaVersion": {
            "type": "number",
            "const": 3
          },
          "namespace": {
            "type": "string",
            "minLength": 1
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "baseVersion": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "status": {
            "type": "string",
            "enum": [
              "DRAFT",
              "VERIFIED",
              "PUBLISHED",
              "DEPRECATED"
            ]
          },
          "publishedAt": {
            "type": "string"
          },
          "contentDigest": {
            "type": "string"
          },
          "objects": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "minLength": 1
                },
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "label": {
                  "type": "string",
                  "minLength": 1
                },
                "description": {
                  "type": "string"
                },
                "sourceTableId": {
                  "type": "string",
                  "minLength": 1
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "DRAFT",
                    "VERIFIED",
                    "PUBLISHED",
                    "DEPRECATED"
                  ]
                },
                "objectType": {
                  "type": "string",
                  "enum": [
                    "ENTITY",
                    "EVENT",
                    "SNAPSHOT",
                    "AGGREGATE",
                    "RELATIONSHIP"
                  ]
                },
                "grainPropertyIds": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "grain": {
                  "type": "string"
                },
                "identityReviewRequired": {
                  "type": "boolean"
                },
                "defaultTimePropertyId": {
                  "type": "string"
                },
                "defaultFilter": {
                  "type": "string"
                },
                "category": {
                  "type": "string"
                },
                "owner": {
                  "type": "string"
                },
                "exampleQuestions": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "properties": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string",
                        "minLength": 1
                      },
                      "name": {
                        "type": "string",
                        "minLength": 1
                      },
                      "label": {
                        "type": "string",
                        "minLength": 1
                      },
                      "description": {
                        "default": "",
                        "type": "string"
                      },
                      "dataType": {
                        "type": "string",
                        "minLength": 1
                      },
                      "sourceColumn": {
                        "type": "string",
                        "minLength": 1
                      },
                      "sensitive": {
                        "type": "boolean"
                      },
                      "meaning": {
                        "type": "string",
                        "enum": [
                          "ID",
                          "CODE",
                          "NAME",
                          "ENTITY_REFERENCE",
                          "CATEGORY",
                          "TIME",
                          "NUMBER",
                          "BOOLEAN",
                          "GEOGRAPHY",
                          "TEXT"
                        ]
                      },
                      "unique": {
                        "type": "boolean"
                      },
                      "valueSearchable": {
                        "type": "boolean"
                      },
                      "numericSpec": {
                        "type": "object",
                        "properties": {
                          "kind": {
                            "type": "string",
                            "enum": [
                              "GENERAL",
                              "CURRENCY",
                              "RATIO"
                            ]
                          },
                          "unit": {
                            "type": "string"
                          },
                          "currency": {
                            "type": "string"
                          },
                          "defaultAggregation": {
                            "type": "string",
                            "enum": [
                              "SUM",
                              "AVG",
                              "MIN",
                              "MAX",
                              "NONE"
                            ]
                          },
                          "aggregationBehavior": {
                            "type": "string",
