          {
            "in": "query",
            "name": "version",
            "required": false,
            "description": "发布版本号或 latest；省略时读取最新发布版本。",
            "schema": {
              "type": "string",
              "default": "latest"
            }
          },
          {
            "in": "query",
            "name": "projection",
            "required": false,
            "description": "图谱视图：relations 关系、metrics 指标、axioms 公理。",
            "schema": {
              "type": "string",
              "enum": [
                "relations",
                "metrics",
                "axioms"
              ],
              "default": "relations"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "data 包含 ontologyVersion、nodes 和 edges。",
