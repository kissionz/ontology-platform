{
  "openapi": "3.1.0",
  "info": {
    "title": "Ontology Platform API",
    "version": "1.0.0",
    "description": "独立本体管理、语义解析与安全查询 API"
  },
  "servers": [
    {
      "url": "/v1"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "GetHealth",
        "summary": "检查服务状态",
        "description": "查看服务版本、组件配置状态和服务器时间；组件显示已配置不代表数据库连接测试通过。",
        "security": [],
        "x-required-scopes": "无需认证",
        "parameters": [],
        "responses": {
          "200": {
            "description": "直接返回状态对象，包含 status、version、kernelVersion、components、time。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
    "/system/openapi.json": {
      "get": {
        "operationId": "GetOpenApiDocument",
        "summary": "读取 API 契约",
        "description": "获取当前服务提供的 OpenAPI 3.1 文档，包含接口、参数、请求结构和中文说明。",
        "security": [],
        "x-required-scopes": "无需认证",
        "parameters": [],
        "responses": {
          "200": {
            "description": "直接返回 OpenAPI 文档，主要字段为 paths、components.schemas、info。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
    "/namespaces/{ns}/summary": {
      "get": {
        "operationId": "GetOntologySummary",
        "summary": "读取本体概览",
        "description": "查看指定发布版本的对象、关系、指标、层级数量和版本摘要。",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-required-scopes": "ontology:read",
        "parameters": [
          {
            "in": "path",
            "name": "ns",
            "required": true,
            "description": "本体命名空间，例如 retail。",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "version",
            "required": false,
            "description": "发布版本号或 latest；省略时读取最新发布版本。",
            "schema": {
              "type": "string",
              "default": "latest"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "data 包含版本信息、counts 和 contentDigest；响应头提供 ETag。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "401": {
            "description": "缺少或使用了无效 Bearer API Key。"
          },
          "403": {
            "description": "密钥缺少所需权限，检查 error.details.requiredScopes。"
          },
          "429": {
            "description": "请求超过客户端限额，稍后重试。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
    "/namespaces/{ns}/ontology": {
      "get": {
        "operationId": "GetOntologySnapshot",
        "summary": "读取本体快照",
        "description": "导出指定发布版本的本体、公理和推论，遵循敏感字段导出边界。If-None-Match 可用于缓存校验。",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-required-scopes": "ontology:read",
        "parameters": [
          {
            "in": "path",
            "name": "ns",
            "required": true,
            "description": "本体命名空间，例如 retail。",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "version",
            "required": false,
            "description": "发布版本号或 latest；省略时读取最新发布版本。",
            "schema": {
              "type": "string",
              "default": "latest"
            }
          },
          {
            "in": "header",
            "name": "If-None-Match",
            "required": false,
            "description": "上次响应的 ETag，相同则返回 304。",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "data 为完整可导出快照；ETag 匹配时返回 HTTP 304，响应体为空。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "304": {
            "description": "快照未改变，响应体为空。"
          },
          "400": {
            "description": "参数不符合契约，检查 error.message 和 error.details。"
          },
          "401": {
            "description": "缺少或使用了无效 Bearer API Key。"
          },
          "403": {
            "description": "密钥缺少所需权限，检查 error.details.requiredScopes。"
          },
          "429": {
            "description": "请求超过客户端限额，稍后重试。"
          },
          "default": {
            "description": "检查响应 status 以及 error 的 code、message、stage、retryable、action；用 auditId 关联调用审计。"
          }
        }
      }
    },
    "/namespaces/{ns}/graph": {
      "get": {
        "operationId": "GetOntologyGraph",
        "summary": "读取本体图谱",
        "description": "按关系、指标或公理视图获取图谱节点和连线。",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-required-scopes": "ontology:read",
        "parameters": [
          {
            "in": "path",
            "name": "ns",
            "required": true,
            "description": "本体命名空间，例如 retail。",
